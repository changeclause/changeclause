name: CI
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm demo
      - run: pnpm qualify
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e 'if (!/^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9._/-]+\))?!?: .+/.test(process.env.PR_TITLE)) { console.error("Use a Conventional Commit PR title, for example feat(cli): add evidence import"); process.exit(1); }'
  quality:
    if: always()
    needs: [validate, title, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          VALIDATE: ${{ needs.validate.result }}
          TITLE: ${{ needs.title.result }}
          DOCS: ${{ needs.docs.result }}
        run: test "$VALIDATE" = success && test "$TITLE" = success && test "$DOCS" = success
